name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python -c 'import os, runpy;
          version = runpy.run_path("src/assinafy/_version.py")["__version__"];
          tag = os.environ["RELEASE_TAG"];
          assert tag == f"v{version}", f"{tag!r} does not match v{version}"'

      - name: Install SDK and build tooling
        run: python -m pip install -e ".[dev]" build twine

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Format check (ruff)
        run: ruff format --check src tests scripts

      - name: Type check (mypy)
        run: mypy src scripts/live_smoke.py

      - name: Test (pytest)
        run: pytest -q --cov=assinafy --cov-branch --cov-fail-under=90 --cov-report=term-missing

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Verify installed wheel
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m venv "$RUNNER_TEMP/assinafy-wheel-test"
          "$RUNNER_TEMP/assinafy-wheel-test/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/assinafy-wheel-test/bin/python" -m pip check
          "$RUNNER_TEMP/assinafy-wheel-test/bin/python" -c 'import os; from importlib.metadata import version; import assinafy; expected = os.environ["RELEASE_TAG"].removeprefix("v"); assert version("assinafy") == expected == assinafy.__version__'

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/assinafy
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish via PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish-pypi
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)",
              Path("CHANGELOG.md").read_text(encoding="utf-8"),
              re.MULTILINE | re.DOTALL,
          )
          if not match or not (notes := match[1].strip()):
              raise SystemExit("Release version must have a non-empty changelog entry")
          Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_text(
              notes + "\n", encoding="utf-8"
          )
          PY

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
